<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="2; url=fan-cards.html" />
  <title data-i18n="messageBoard.documentTitle">Seiga Studio - 팬 카드 수신함으로 이동</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/public-pages.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="index.html">
        <div class="logo">S</div>
        <div class="brand-text"><strong>Seiga Studio</strong><span data-i18n="public.brandSubtitle">스트리머 프로필 플랫폼</span></div>
      </a>
      <nav class="nav">
        <a href="streamers.html" data-public-nav data-i18n="nav.streamers">스트리머</a>
        <a href="rankings.html" data-public-nav data-i18n="nav.rankings">인기 랭킹</a>
        <a href="fan-card-write.html" data-public-nav data-i18n="nav.fanCard">팬 카드</a>
        <a href="about.html" data-public-nav data-i18n="nav.about">서비스 소개</a>
      </nav>
      <div class="header-actions">
        <div class="language-switcher" data-i18n-aria-label="language.label" aria-label="언어 선택">
          <button type="button" data-lang-option="ko">KR</button>
          <button type="button" data-lang-option="ja">JA</button>
        </div>
        <a class="primary-btn" href="login.html" data-i18n="nav.start">Twitch로 시작하기</a>
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow" data-i18n="messageBoard.eyebrow">Message Board Route</div>
      <h1 data-i18n="messageBoard.title">팬 카드 수신함으로 이동합니다.</h1>
      <p data-i18n="messageBoard.description">message-board 기능은 현재 대시보드의 팬 카드 수신함으로 통합되어 있습니다. 로그인 후 수신한 팬 카드와 읽기 큐를 관리할 수 있습니다.</p>
      <div class="hero-actions">
        <a class="primary-btn" href="fan-cards.html" data-i18n="messageBoard.goInbox">수신함으로 이동</a>
        <a class="ghost-btn" href="dashboard.html" data-i18n="nav.dashboard">대시보드</a>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <div>
          <h2 data-i18n="messageBoard.statusTitle">현재 기능 위치</h2>
          <p data-i18n="messageBoard.statusDescription">수신 카드 목록, empty state, 상태 변경 API 연동은 fan-cards.html에서 처리됩니다.</p>
        </div>
        <span class="badge">Dashboard</span>
      </div>
    </section>
  </div>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/public.js"></script>
</body>
</html>
