<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=login.html" />
  <title data-i18n="auth.loginDocumentTitle">Seiga Studio - 로그인</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/public-pages.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="index.html">
        <div class="logo">S</div>
        <div class="brand-text"><strong>Seiga Studio</strong><span data-i18n="public.brandSubtitle">스트리머 프로필 플랫폼</span></div>
      </a>
      <div class="header-actions">
        <div class="language-switcher" data-i18n-aria-label="language.label" aria-label="언어 선택">
          <button type="button" data-lang-option="ko">KR</button>
          <button type="button" data-lang-option="ja">JA</button>
        </div>
        <a class="primary-btn" href="login.html" data-i18n="nav.start">Twitch로 시작하기</a>
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow" data-i18n="auth.loginTitle">Twitch로 시작하기</div>
      <h1 data-i18n="auth.loginTitle">Twitch로 시작하기</h1>
      <p data-i18n="auth.loginDescription">일반 사용자는 Twitch로 가입/로그인하고 바로 팔로우 목록을 확인할 수 있습니다.</p>
      <div class="hero-actions">
        <a class="primary-btn" href="login.html" data-i18n="nav.start">Twitch로 시작하기</a>
        <a class="ghost-btn" href="streamers.html" data-i18n="nav.streamers">스트리머</a>
      </div>
    </section>
  </div>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/public.js"></script>
</body>
</html>
