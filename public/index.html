<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="index.documentTitle">Seiga Studio - 공개 홈</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/public-pages.css" />
    <link rel="stylesheet" href="css/card.css" />
</head>

<body>
<div class="page page--home">
    <header class="header">
        <a class="brand" href="index.html">
            <div class="logo">S</div>
            <div class="brand-text">
                <strong>Seiga Studio</strong>
                <span data-i18n="public.brandSubtitle">Streamer Profile Platform</span>
            </div>
        </a>

        <nav id="publicNavigation" class="nav">
            <a href="streamers.html" data-public-nav data-i18n="nav.streamers">스트리머</a>
            <a href="rankings.html" data-public-nav data-i18n="nav.rankings">인기 랭킹</a>
            <a href="fan-card-write.html" data-public-nav data-i18n="nav.fanCard">팬 카드</a>
            <a href="about.html" data-public-nav data-i18n="nav.about">서비스 소개</a>
        </nav>

        <div class="header-actions">
            <div class="language-switcher" data-i18n-aria-label="language.label" aria-label="Language selector">
                <button type="button" data-lang-option="ko">KR</button>
                <button type="button" data-lang-option="ja">JA</button>
            </div>
            <a class="primary-btn" href="login.html" data-i18n="nav.start">
              Twitch로 시작하기
            </a>
            <button class="mobile-menu" type="button" aria-controls="publicNavigation" aria-expanded="false" data-i18n-aria-label="dashboard.mobileMenu" aria-label="메뉴 열기">☰</button>
        </div>
    </header>

    <section class="hero home-hero">
        <div class="hero-main">
            <div class="eyebrow" data-i18n="index.eyebrow">🌸 Streamer Search</div>
            <h1 data-i18n="index.title">스트리머를 찾아보세요.</h1>
            <p data-i18n="index.description">
                로그인하지 않아도 공개된 스트리머 프로필과 방송 정보를 둘러볼 수 있습니다. 즐겨찾기, 팬 카드 작성, 개인 대시보드는 로그인 후 이용할 수 있어요.
            </p>

            <div class="search-box">
                <input id="searchInput" type="search" placeholder="스트리머 이름, 게임, 태그 검색" data-i18n-placeholder="index.searchPlaceholder" />
                <button type="button" id="searchButton" data-i18n="index.searchButton">검색</button>
            </div>

            <div class="hero-actions">
                <a class="primary-btn" href="streamers.html" data-i18n="index.viewAllStreamers">전체 스트리머 보기</a>
                <a class="ghost-btn" href="login.html" data-i18n="nav.start">Twitch로 시작하기</a>
            </div>

            <div id="heroTagList" class="hero-tags" aria-live="polite">
                <span class="hero-tag">태그 데이터를 불러오는 중입니다.</span>
            </div>
        </div>

        <aside class="hero-side home-popular-panel">
            <div class="side-title">
                <h2 data-i18n="index.popularTitle">오늘의 인기 스트리머</h2>
                <span data-i18n="index.popularBadge">LIVE RANKING</span>
            </div>

            <div id="popularStreamersList" class="rank-list rank-list--home" aria-live="polite">
                <article class="rank-card rank-card--skeleton liquid-card" aria-hidden="true">
                    <span class="skeleton-block rank-no"></span>
                    <span class="skeleton-block rank-avatar"></span>
                    <span class="rank-info">
                        <span class="skeleton-block skeleton-line"></span>
                        <span class="skeleton-block skeleton-line short"></span>
                    </span>
                    <span class="skeleton-block skeleton-chip"></span>
                </article>
                <article class="rank-card rank-card--skeleton liquid-card" aria-hidden="true">
                    <span class="skeleton-block rank-no"></span>
                    <span class="skeleton-block rank-avatar"></span>
                    <span class="rank-info">
                        <span class="skeleton-block skeleton-line"></span>
                        <span class="skeleton-block skeleton-line short"></span>
                    </span>
                    <span class="skeleton-block skeleton-chip"></span>
                </article>
                <article class="rank-card rank-card--skeleton liquid-card" aria-hidden="true">
                    <span class="skeleton-block rank-no"></span>
                    <span class="skeleton-block rank-avatar"></span>
                    <span class="rank-info">
                        <span class="skeleton-block skeleton-line"></span>
                        <span class="skeleton-block skeleton-line short"></span>
                    </span>
                    <span class="skeleton-block skeleton-chip"></span>
                </article>
            </div>
        </aside>
    </section>

</div>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
  <script src="js/shared.js"></script>
<script src="js/public.js"></script>
</body>
</html>
