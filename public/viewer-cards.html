<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="2; url=fan-card-write.html" />
  <title data-i18n="viewerCards.documentTitle">Seiga Studio - 팬 카드 작성으로 이동</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/public-pages.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="index.html">
        <div class="logo">S</div>
        <div class="brand-text"><strong>Seiga Studio</strong><span data-i18n="public.brandSubtitle">스트리머 프로필 플랫폼</span></div>
      </a>
      <nav class="nav">
        <a href="streamers.html" data-public-nav data-i18n="nav.streamers">스트리머</a>
        <a href="rankings.html" data-public-nav data-i18n="nav.rankings">인기 랭킹</a>
        <a href="fan-card-write.html" data-public-nav data-i18n="nav.fanCard">팬 카드</a>
        <a href="about.html" data-public-nav data-i18n="nav.about">서비스 소개</a>
      </nav>
      <div class="header-actions">
        <div class="language-switcher" data-i18n-aria-label="language.label" aria-label="언어 선택">
          <button type="button" data-lang-option="ko">KR</button>
          <button type="button" data-lang-option="ja">JA</button>
        </div>
        <a class="primary-btn" href="login.html" data-i18n="nav.start">Twitch로 시작하기</a>
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow" data-i18n="viewerCards.eyebrow">Fan Card Route</div>
      <h1 data-i18n="viewerCards.title">팬 카드 작성 화면으로 이동합니다.</h1>
      <p data-i18n="viewerCards.description">viewer-cards 기능은 현재 공개 팬 카드 작성 화면으로 통합되어 있습니다. 잠시 후 스트리머 검색과 팬 카드 작성이 가능한 화면으로 이동합니다.</p>
      <div class="hero-actions">
        <a class="primary-btn" href="fan-card-write.html" data-i18n="viewerCards.goWrite">팬 카드 작성하기</a>
        <a class="ghost-btn" href="streamers.html" data-i18n="nav.backToList">목록으로</a>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <div>
          <h2 data-i18n="viewerCards.statusTitle">현재 기능 위치</h2>
          <p data-i18n="viewerCards.statusDescription">대상 스트리머 검색, empty state, 실제 공개 스트리머 API 연동은 fan-card-write.html에서 처리됩니다.</p>
        </div>
        <span class="badge">Merged</span>
      </div>
    </section>
  </div>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/public.js"></script>
</body>
</html>
