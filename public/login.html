<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="auth.loginDocumentTitle">Seiga Studio - 로그인</title>

  <style>
    :root {
      --bg: #f8f5ff;
      --glass: rgba(255, 255, 255, 0.66);
      --border: rgba(255, 255, 255, 0.72);
      --text: #202033;
      --muted: #7b7890;
      --primary: #7c3aed;
      --primary-light: #a78bfa;
      --pink: #f9a8d4;
      --danger: #fb7185;
      --shadow: 0 24px 60px rgba(102, 88, 160, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      color: var(--text);
      background:
              radial-gradient(circle at 10% 10%, rgba(249, 168, 212, 0.65), transparent 34%),
              radial-gradient(circle at 90% 15%, rgba(147, 197, 253, 0.75), transparent 34%),
              linear-gradient(135deg, #fbf7ff 0%, #eef7ff 52%, #fff7fb 100%);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 34px;
      border-radius: 30px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(28px);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      font-size: 22px;
      background: linear-gradient(135deg, var(--primary), var(--pink));
      box-shadow: 0 14px 30px rgba(124, 58, 237, 0.25);
    }

    .brand strong {
      display: block;
      font-size: 18px;
      letter-spacing: -0.03em;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      font-size: 30px;
      letter-spacing: -0.05em;
      margin-bottom: 8px;
    }

    .desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      font-weight: 650;
      margin-bottom: 24px;
    }

    .twitch-button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, #9146ff, #b079ff);
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 16px 34px rgba(145, 70, 255, 0.28);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(123, 120, 144, 0.2);
    }

    .form {
      display: grid;
      gap: 15px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      font-size: 13px;
      font-weight: 900;
    }

    .field input {
      width: 100%;
      height: 52px;
      border: 1px solid rgba(150, 140, 180, 0.24);
      border-radius: 18px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.76);
      outline: none;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .field input:focus {
      border-color: rgba(124, 58, 237, 0.45);
      box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.16);
      background: rgba(255, 255, 255, 0.92);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 2px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .remember input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    .forgot {
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
    }

    .login-button {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--pink));
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 16px 34px rgba(124, 58, 237, 0.24);
      margin-top: 8px;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 13px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      color: #be123c;
      background: rgba(251, 113, 133, 0.16);
    }

    .message.success {
      display: block;
      color: #15803d;
      background: rgba(134, 239, 172, 0.22);
    }

    .admin-notice {
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
      font-weight: 700;
    }

    .admin-login {
      margin-top: 18px;
      padding: 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      background: rgba(255, 255, 255, 0.42);
    }

    .admin-login summary {
      color: var(--primary);
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      list-style: none;
    }

    .admin-login summary::-webkit-details-marker {
      display: none;
    }

    .admin-login summary::after {
      content: "+";
      float: right;
      color: var(--muted);
      font-weight: 900;
    }

    .admin-login[open] summary::after {
      content: "-";
    }

    .admin-login .form {
      margin-top: 16px;
    }

    .admin-login-note {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      font-weight: 700;
    }

    .login-language {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      padding: 4px;
      width: max-content;
      margin: -8px 0 18px auto;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.56);
    }

    .login-language button {
      min-width: 36px;
      height: 32px;
      padding: 0 10px;
      border: 0;
      border-radius: 11px;
      color: var(--muted);
      background: transparent;
      box-shadow: none;
      font-size: 12px;
      line-height: 1;
      font-weight: 900;
      cursor: pointer;
      transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .login-language button:hover {
      color: var(--primary);
      background: rgba(167, 139, 250, 0.14);
    }

    .login-language button.active,
    .login-language button[aria-pressed="true"] {
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--pink));
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.18);
    }

    .login-language button:active {
      transform: translateY(1px);
    }

    .login-language button:focus-visible {
      outline: 3px solid rgba(124, 58, 237, 0.24);
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 26px 22px;
        border-radius: 24px;
      }

      h1 {
        font-size: 26px;
      }

      .options {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
<main class="login-card">
  <div class="brand">
    <div class="logo">S</div>
    <div>
      <strong>Seiga Studio</strong>
      <span data-i18n="dashboard.brandSubtitle">스트리머 대시보드</span>
    </div>
  </div>

  <div class="language-switcher login-language" data-i18n-aria-label="language.label" aria-label="언어 선택">
    <button type="button" data-lang-option="ko">KR</button>
    <button type="button" data-lang-option="ja">JA</button>
  </div>

  <h1 data-i18n="auth.loginTitle">Twitch로 시작하기</h1>
  <p class="desc" data-i18n="auth.loginDescription">
    일반 사용자는 Twitch로 가입/로그인하고 바로 팔로우 목록을 확인할 수 있습니다.
  </p>

  <button id="twitchLoginButton" class="twitch-button" type="button" data-i18n="auth.twitchLogin">
    Twitch로 가입/로그인
  </button>

  <details class="admin-login">
    <summary data-i18n="auth.adminEmailLogin">관리자/이메일 로그인</summary>
    <p class="admin-login-note" data-i18n="auth.adminEmailLoginNote">관리자 계정 또는 비밀번호를 발급받은 계정만 사용합니다.</p>
    <form id="loginForm" class="form">
      <div class="field">
        <label for="email" data-i18n="auth.email">이메일</label>
        <input
                id="email"
                name="email"
                type="email"
                placeholder="example@email.com"
                autocomplete="email"
                required
        />
      </div>

      <div class="field">
        <label for="password" data-i18n="auth.password">비밀번호</label>
        <input
                id="password"
                name="password"
                type="password"
                placeholder="비밀번호를 입력하세요"
                data-i18n-placeholder="auth.passwordPlaceholder"
                autocomplete="current-password"
                required
        />
      </div>

      <div class="options">
        <label class="remember">
          <input id="rememberMe" type="checkbox" />
          <span data-i18n="auth.rememberMe">로그인 상태 유지</span>
        </label>

        <a class="forgot" href="forgot-password.html" data-i18n="auth.forgotPassword">비밀번호 찾기</a>
      </div>

      <button id="loginButton" class="login-button" type="submit" data-i18n="nav.login">
        로그인
      </button>
    </form>
  </details>

  <div id="message" class="message"></div>

  <p class="admin-notice">
    <span data-i18n="auth.adminNotice">일반 사용자는 관리자 승인 없이 Twitch로 시작할 수 있습니다. 스트리머 등록은 별도 신청 화면에서 진행합니다.</span>
    <a class="forgot" href="register.html" data-i18n="auth.goRegister">가입 안내</a>
  </p>
</main>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
  <script src="js/shared.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
